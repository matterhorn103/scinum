[package]
name = "scinum"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = ["scidecimal"]
scidecimal = []
scifloat = []

[dependencies]
bigdecimal = "0.4.10"
num-integer = "0.1.46"
num-traits = "0.2.19"
regex = "1.12.2"
rust_decimal_macros = "1.39.0"
serde = "1.0.228"
serde_with = "3.16.1"

[dependencies.rust_decimal]
version = "1.39.0"
features = ["maths"]

[dev-dependencies]
itertools = "0.15"
proptest = "1.11.0"
